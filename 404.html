<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Страница не найдена — Максим Лобяк</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="/image/Favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=20260827-1">
  <style>
    .not-found{min-height:100svh;display:grid;place-items:center;padding:32px;background:#f1efe9;color:#080808;text-align:center}
    .not-found__code{display:block;font-family:Italiana,serif;font-size:clamp(96px,24vw,280px);font-weight:400;line-height:.8}
    .not-found h1{margin:32px 0 12px;font-size:clamp(28px,4vw,52px);font-weight:500}
    .not-found p{max-width:520px;margin:0 auto 28px;font-size:18px;line-height:1.5}
    .not-found a{display:inline-flex;padding:14px 22px;border:1px solid currentColor;border-radius:999px;color:inherit;text-decoration:none}
  </style>
</head>
<body>
  <main class="not-found">
    <div>
      <span class="not-found__code" aria-hidden="true">404</span>
      <h1>Страница не найдена</h1>
      <p>Возможно, адрес изменился или в ссылке есть ошибка.</p>
      <a href="/">Вернуться на главную</a>
    </div>
  </main>
</body>
</html>
